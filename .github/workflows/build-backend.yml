name: Build Painting Inpaint Backend

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/build-backend.yml"

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/painting-inpaint-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "BACKEND_IMAGE_NAME_LOWER=$(echo '${{ env.BACKEND_IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME_LOWER }}:latest
            ${{ env.BACKEND_IMAGE_NAME_LOWER }}:${{ github.sha }}
